<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a0a00">
  <meta name="description" content="Ontdek de personages en huizen van Game of Thrones">
  <title>Game of Thrones</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1 class="logo">Game of Thrones</h1>
    <div class="search-container">
      <input
        type="search"
        id="search-input"
        placeholder="Zoek een personage..."
        aria-label="Zoek een personage"
        autocomplete="off"
      >
    </div>
  </header>

  <main id="main-content">
    <!-- Huizenoverzicht -->
    <section id="houses-view" class="view active">
      <div id="houses-grid" class="grid"></div>
    </section>

    <!-- Personageoverzicht (binnen een huis) -->
    <section id="house-view" class="view">
      <div class="house-header">
        <button id="back-btn" aria-label="Terug naar huizen">&#8592; Terug</button>
        <div>
          <h2 id="house-title"></h2>
          <p id="house-motto" class="motto"></p>
        </div>
      </div>
      <div id="characters-grid" class="grid"></div>
    </section>

    <!-- Zoekresultaten -->
    <section id="search-view" class="view">
      <h2 class="search-heading">Zoekresultaten</h2>
      <div id="search-results" class="grid"></div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
