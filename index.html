<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a0a00">
  <meta name="description" content="Ontdek de personages, locaties en wereld van Game of Thrones">
  <title>Game of Thrones</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <header>
    <div class="header-top">
      <nav class="show-selector" aria-label="Kies serie">
        <button class="show-btn active" data-show="got">Game of Thrones</button>
        <span class="show-divider">|</span>
        <button class="show-btn" data-show="hotd">House of the Dragon</button>
      </nav>
      <button id="theme-toggle" class="theme-toggle" aria-label="Schakel thema" title="Schakel naar lichte modus">☀️</button>
    </div>
    <div class="search-container">
      <input
        type="search"
        id="search-input"
        placeholder="Zoek personages, locaties, termen..."
        aria-label="Zoeken"
        autocomplete="off"
      >
    </div>
  </header>

  <!-- Navigatietabbladen -->
  <nav class="main-nav" role="tablist">
    <button class="nav-tab active" data-tab="houses" role="tab" aria-selected="true">Huizen</button>
    <button class="nav-tab" data-tab="locations" role="tab" aria-selected="false">Locaties</button>
    <button class="nav-tab" data-tab="creatures" role="tab" aria-selected="false">Wezens</button>
    <button class="nav-tab" data-tab="organizations" role="tab" aria-selected="false">Organisaties</button>
    <button class="nav-tab" data-tab="glossary" role="tab" aria-selected="false">Woordenlijst</button>
    <button class="nav-tab" data-tab="seasons" role="tab" aria-selected="false">Seizoenen</button>
  </nav>

  <main id="main-content">

    <!-- === HUIZEN === -->
    <section id="houses-view" class="view active">
      <div id="houses-grid" class="grid"></div>
    </section>

    <!-- Personageoverzicht (binnen een huis) -->
    <section id="house-view" class="view">
      <div class="house-header">
        <button id="back-btn" aria-label="Terug naar huizen">&#8592; Terug</button>
        <div>
          <h2 id="house-title"></h2>
          <p id="house-motto" class="motto"></p>
        </div>
      </div>
      <div id="characters-grid" class="grid"></div>
    </section>

    <!-- Zoekresultaten -->
    <section id="search-view" class="view">
      <h2 class="section-heading">Zoekresultaten</h2>
      <div id="search-results" class="results-list"></div>
    </section>

    <!-- === LOCATIES === -->
    <section id="locations-view" class="view">
      <div id="locations-list" class="info-list"></div>
    </section>

    <!-- === WEZENS === -->
    <section id="creatures-view" class="view">
      <div id="creatures-list" class="info-list"></div>
    </section>

    <!-- === ORGANISATIES === -->
    <section id="organizations-view" class="view">
      <div id="organizations-list" class="info-list"></div>
    </section>

    <!-- === WOORDENLIJST === -->
    <section id="glossary-view" class="view">
      <div id="glossary-list" class="glossary-list"></div>
    </section>

    <!-- === SEIZOENEN === -->
    <section id="seasons-view" class="view">
      <p class="spoiler-notice">&#9888; De seizoensamenvattingen bevatten spoilers. Open ze pas nadat je dat seizoen hebt gekeken.</p>
      <div id="seasons-list" class="seasons-list"></div>
    </section>

  </main>

  <script src="js/app.js?v=6"></script>
</body>
</html>
